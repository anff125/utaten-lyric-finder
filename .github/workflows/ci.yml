name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "scripts/build_portable.ps1"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "scripts/build_portable.ps1"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  lint-and-runtime-smoke:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          # 優化 1：開啟 setup-python 內建的 pip 快取
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Upgrade pip and install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run ruff
        shell: pwsh
        run: |
          ruff check .

      - name: Lint PowerShell scripts
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path ./scripts/build_portable.ps1 -EnableExit

      - name: Run unit tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v

      - name: Runtime smoke test
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); import webview; from utaten_finder.core import config, events, orchestrator; from utaten_finder.media import spotify_api, system_media; from utaten_finder.lyrics import web_scraper, parser, matching, song_cache, trace; from utaten_finder.audio import process_loopback, cuda_loader, asr_worker; from utaten_finder.ui import webview_app; print('[SUCCESS] runtime smoke imports loaded')"

      - name: Dry-run portable build script
        shell: pwsh
        run: |
          Write-Host "開始驗證打包腳本 (Dry-run)..."

          $OutputRoot = "build\portable\utaten-lyric-finder"
          $PythonRoot = Join-Path $OutputRoot "python_env"
          New-Item -ItemType Directory -Path $PythonRoot -Force | Out-Null

          ./scripts/build_portable.ps1 -SkipEnvBuild

          $ZipPath = "build\portable\utaten-lyric-finder.zip"
          if (-Not (Test-Path $ZipPath)) {
              Write-Error "[ERROR] Dry-run 失敗：找不到預期的壓縮檔 $ZipPath"
              exit 1
          }

          $RequiredFiles = @(
              "start.bat",
              "update.bat",
              "assets\web\index.html",
              "src\utaten_finder\ui\webview_app.py"
          )
          foreach ($RelPath in $RequiredFiles) {
              $FullPath = Join-Path $OutputRoot $RelPath
              if (-Not (Test-Path $FullPath)) {
                  Write-Error "[ERROR] Dry-run 失敗：缺少預期檔案 $FullPath"
                  exit 1
              }
          }

          $ForbiddenFiles = @(
              "src\utaten_finder\ui\legacy_gui.py",
              "src\utaten_finder\lyrics\browser_sync.py"
          )
          foreach ($RelPath in $ForbiddenFiles) {
              $FullPath = Join-Path $OutputRoot $RelPath
              if (Test-Path $FullPath) {
                  Write-Error "[ERROR] Dry-run 失敗：發現不應存在的舊版檔案 $FullPath"
                  exit 1
              }
          }

          Write-Host "[SUCCESS] 打包腳本執行無誤，產出物已成功生成！"
